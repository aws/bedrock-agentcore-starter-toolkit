name: Release Prepare

# Stage 1 of 2 of the release process.
#
# This workflow ONLY prepares a release: it bumps the version, opens a release
# PR, and validates that PR (tests + build). It deliberately does NOT publish.
# Publication happens in release-publish.yml, which triggers when the release
# PR is merged to main. This gives the operator a chance to review the PR
# (and fix the changelog) before anything is shipped, and guarantees the
# version-bump commit is on main before the tag / release notes are cut.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (only patch allowed)'
        required: true
        type: choice
        options:
          - patch
          - pre
      sdk_version:
        description: 'SDK version to depend on (optional)'
        required: false
        type: string
      wait_for_sdk:
        description: 'Wait for SDK version on PyPI'
        required: false
        type: boolean
        default: false
      changelog:
        description: 'Custom changelog entry (optional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: aws-release-4-core
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Block minor and major releases
        if: ${{ github.event.inputs.bump_type == 'minor' || github.event.inputs.bump_type == 'major' }}
        run: |
          echo "::error::Minor and major releases are blocked. Only patch and pre releases are allowed."
          exit 1

      - name: Validate running from main
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Must run from main branch, got $GITHUB_REF"
          exit 1

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install requests  # Needed for SDK version checking

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -m1 -oP '^version = "\K[^"]+' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          SDK_VERSION: ${{ github.event.inputs.sdk_version }}
          WAIT_FOR_SDK: ${{ github.event.inputs.wait_for_sdk }}
          CHANGELOG_INPUT: ${{ github.event.inputs.changelog }}
        run: |
          source .venv/bin/activate

          # Make script executable
          chmod +x scripts/bump-version.py

          # Build command as an array so untrusted inputs are passed as
          # distinct argv entries and never re-parsed by the shell.
          CMD=(python scripts/bump-version.py "$BUMP_TYPE")

          # Add SDK update if specified
          if [ -n "$SDK_VERSION" ]; then
            CMD+=(--update-sdk "$SDK_VERSION")
            if [ "$WAIT_FOR_SDK" = "true" ]; then
              CMD+=(--wait-for-sdk)
            fi
          fi

          # Add changelog if specified
          if [ -n "$CHANGELOG_INPUT" ]; then
            CMD+=(--changelog "$CHANGELOG_INPUT")
          fi

          # Run version bump
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

          # Update lockfile after all changes
          uv lock --no-progress

          # Get new version
          NEW_VERSION=$(grep -m1 -oP '^version = "\K[^"]+' pyproject.toml)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          BRANCH_NAME="release/v${VERSION}"

          # Clean up any existing branch from previous attempts
          if git ls-remote --exit-code --heads origin $BRANCH_NAME; then
            echo "⚠  Branch $BRANCH_NAME already exists. Deleting it first..."
            git push origin --delete $BRANCH_NAME
          fi

          # Clean up local branch if exists
          if git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
            git branch -D $BRANCH_NAME
          fi

          # Create fresh branch
          git checkout -b $BRANCH_NAME

          # Add all changes
          git add -A

          # Commit with co-author
          git commit -m "chore: bump version to ${VERSION}

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          # Push the branch
          git push origin $BRANCH_NAME

          # Verify the version was committed
          COMMITTED_VERSION=$(git show HEAD:pyproject.toml | grep -m1 -oP '^version = "\K[^"]+')
          if [ "$COMMITTED_VERSION" != "${VERSION}" ]; then
            echo "❌ ERROR: Version not committed correctly!"
            exit 1
          fi

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          SDK_VERSION: ${{ github.event.inputs.sdk_version }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          BRANCH_NAME="release/v${VERSION}"

          # Build optional SDK lines only when an SDK version was provided.
          SDK_CHANGE_LINE=""
          SDK_CHECKLIST_LINE=""
          if [ -n "$SDK_VERSION" ]; then
            SDK_CHANGE_LINE="- Updated SDK dependency to >=${SDK_VERSION}"
            SDK_CHECKLIST_LINE="- [ ] Verify SDK version is available on PyPI"
          fi

          # Create PR using GitHub CLI
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Release v${VERSION}" \
            --body "## 🚀 Release v${VERSION}

          This PR was automatically created by the **release-prepare** workflow.

          ### Changes
          - Version bumped from ${CURRENT_VERSION} to ${VERSION}
          - Updated CHANGELOG.md
          - Updated uv.lock
          ${SDK_CHANGE_LINE}

          ### ⚠  Pre-merge Checklist
          - [ ] Review CHANGELOG.md - ensure it has meaningful release notes
          - [ ] Verify version numbers are correct
          - [ ] All CI checks are passing
          - [ ] Documentation updated (if needed)
          ${SDK_CHECKLIST_LINE}

          ### 📝 How to improve the changelog
          If the auto-generated changelog isn't good enough:
          1. Edit CHANGELOG.md in this PR
          2. Commit the changes to this branch
          3. Then approve and merge

          ### 🔄 Release Process
          Nothing is published yet. After this PR is merged to main, the
          **release-publish** workflow will:
          1. Build the package from main
          2. Require **manual approval** before publishing to PyPI
          3. Publish to PyPI, create the tag, and create the GitHub release

          ---
          *Triggered by @${GITHUB_ACTOR}*")

          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "Created PR #$PR_NUMBER: $PR_URL"
          echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT

  test:
    name: Test
    needs: prepare-release
    runs-on: aws-release-4-core
    if: needs.prepare-release.result == 'success'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --dev

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ --cov=src --cov-report=xml --cov-fail-under=80 \
            -k "not test_launch_help_text_updated"

  build:
    name: Build Distribution
    needs: prepare-release
    runs-on: aws-release-4-core
    if: needs.prepare-release.result == 'success'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v${{ needs.prepare-release.outputs.version }}

      - name: Verify version before build
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          ACTUAL_VERSION=$(grep -m1 -oP '^version = "\K[^"]+' pyproject.toml)

          echo "Expected version: $EXPECTED_VERSION"
          echo "Actual version: $ACTUAL_VERSION"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "Expected $EXPECTED_VERSION but found $ACTUAL_VERSION"
            exit 1
          fi

          echo "✓ Version verified: $ACTUAL_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build package
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          uv build

          ls -la dist/
          if ! ls dist/*-"${VERSION}"-*.whl; then
            echo "❌ ERROR: Built package has wrong version!"
            exit 1
          fi

          # Check with twine using tool run
          uv tool run twine check dist/*

          # Show package contents
          echo "=== Package contents ==="
          python -m zipfile -l dist/*.whl | head -20
